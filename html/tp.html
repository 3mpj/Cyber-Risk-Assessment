<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersecurity Tabletop Exercise</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="Cyber-Risk-Assessment/css/tp.css">
</head>
<body>
    <!--Nav-->
    <nav id="header">
        <div id="container">
          <a class="logo" href="/Cyber-Risk-Assessment">CyberIQ</a>
          <button class="toggle-button" id="nav-toggle">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="24" height="24">
              <title>Menu</title>
              <path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z" />
            </svg>
          </button>
          <div class="menu" id="nav-content">
            <ul>
              <li><a href="learn.html">Learn</a></li>
              <li><a href="survey.html">Assessment</a></li>
              <li><a href="scenario.html">Scenarios</a></li>
              <li><a href="tp.html">Table Top Exercise</a></li>
            </ul>
          </div>
        </div>
        <hr>
      </nav><br>

<div class="container">
    <h1>Cybersecurity Tabletop Exercise</h1>
    <form id="exerciseForm">
        <div class="section">
            <label for="scenarioSelect">Choose a Cyber Threat:</label>
            <select id="scenarioSelect" onchange="populateFields()">
                <option value="">Select Scenario</option>
                <option value="ransomware">Ransomware Attack</option>
                <option value="dos">Denial of Service (DoS) Attack</option>
                <option value="mitm">Man-in-the-Middle Attack</option>
                <option value="phishing">Phishing Attack</option>
                <option value="insider">Insider Threat Attack</option>
                <option value="sqlInjection">SQL Injection Attack</option>
            </select>
        </div>

        <div class="section">
            <h2>Basic Information</h2>
            <label for="exerciseDate">Date:</label>
            <input type="date" id="exerciseDate" name="exerciseDate" required>

            <label for="exerciseTime">Time:</label>
            <input type="time" id="exerciseTime" name="exerciseTime" required>

            <label for="exerciseLocation">Location:</label>
            <input type="text" id="exerciseLocation" name="exerciseLocation" placeholder="e.g., Main Conference Room" required>
        </div>

        <div class="section">
            <h2>Exercise Details</h2>
            <label for="purpose">Purpose:</label>
            <textarea id="purpose" name="purpose" rows="3" required></textarea>

            <label for="objectives">Objectives:</label>
            <textarea id="objectives" name="objectives" rows="3" required></textarea>

            <label for="threatHazard">Threat or Hazard:</label>
            <input type="text" id="threatHazard" name="threatHazard" required>

            <label for="scenarioDescription">Scenario:</label>
            <textarea id="scenarioDescription" name="scenarioDescription" rows="2" required></textarea>
        </div>

        <div class="section">
            <h2>Exercise Activities</h2>
            <label for="activity1">Activity 1 (Time & Description):</label>
            <input type="text" id="activity1" name="activity1" required>

            <label for="activity2">Activity 2 (Time & Description):</label>
            <input type="text" id="activity2" name="activity2" required>

            <label for="activity3">Activity 3 (Time & Description):</label>
            <input type="text" id="activity3" name="activity3" required>
        </div>

        <button type="button" onclick="downloadPDF()">Download Exercise</button>
    </form>
</div>

<script src="Cyber-Risk-Assessment/js/tp.js"></script>
</body>
</html>
